[project]
name = "gitresolve-agent"
version = "0.1.0"
description = "LangGraph-based AI agent for GitHub issue investigation and bug fixing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.115",
    "google-genai",
    "httpx>=0.27",
    "langgraph",
    "pillow>=12.0",
    "pydantic",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "githubapp"]
pythonpath = ["backend", "."]
python_files = ["test_*.py"]

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.16"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "backend"]
include = ["app*", "agent*", "githubapp*", "sandbox*"]
exclude = ["tests*", "backend.tests*"]
