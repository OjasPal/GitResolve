[project]
name = "gitresolve-backend"
version = "0.1.0"
description = "GitResolve API and worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.16"]
dev = ["pytest>=8", "httpx>=0.27"]
agent = ["langgraph", "google-genai", "python-dotenv"]
firestore-test = ["google-cloud-firestore>=2.16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]  # ".." exposes the root `agent/` package to the adapter test
